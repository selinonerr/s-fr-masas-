function viewDanisman(){
 var a=st.ad,b=+a.but;
 var h='<div class="row" style="margin-bottom:20px"><h1 style="margin:0">Çözüm danışmanı</h1><span class="tag" style="background:#fdeccb;color:#8a5a00">Premium</span></div>';
 h+='<div class="card"><div class="form"><div class="w"><label for="ad1">Sorununuz</label><textarea id="ad1" rows="4" placeholder="Örn. Fırın doğalgaz tüketimimiz yüksek, basınçlı hava hattında kaçaklar var.">'+esc(a.prob)+'</textarea></div><div><label for="ad2">Sektör</label><select id="ad2">'+['Seramik','Cam','Porselen','Tekstil','Gıda','Diğer'].map(function(s){return '<option'+(a.sek===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div><div><label for="ad3">Bütçe (KDV hariç)</label><select id="ad3">'+BUT.map(function(x){return '<option value="'+x[0]+'"'+(a.but===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div></div><div class="row" style="margin-top:16px"><button class="btn a" id="adgo"'+(a.loading?' disabled':'')+'>'+(a.loading?'Analiz ediliyor…':'Öneri al')+'</button></div></div>';
 if(a.res){h+=(a.res.ozet?'<p class="body" style="margin:0 0 16px;font-weight:500">'+esc(a.res.ozet)+'</p>':'')+a.res.oner.map(function(o,i){var p=byId(o.id),u=uyum(p,b),v=vakaOf(p),T={uygun:['Bütçenize uygun','background:var(--okt);color:var(--ok)'],belirsiz:['Teklifle netleşir','background:var(--acct);color:var(--acc)'],asiyor:['Bütçeyi aşabilir','background:var(--wnt);color:var(--wn)']}[u.k];
  return '<article class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div class="tile" style="width:120px;height:90px;border-radius:12px;flex:none">'+art(p)+'</div><div class="sp"><div class="row"><span class="tag" style="background:var(--ink);color:var(--paper)">'+(i+1)+'. öneri</span><span class="tag" style="'+T[1]+'">'+T[0]+'</span></div><h2 style="font-size:19px;margin:8px 0 2px">'+esc(p.t)+'</h2><div class="mut">'+esc(p.s)+' · '+esc(u.t)+'</div></div></div><div class="body" style="margin-top:12px">'+esc(o.neden||p.ben)+'</div>'
  +(v?'<div class="vf" style="margin-top:12px"><b>Kaynak vaka:</b> '+esc(v.cust)+' · '+v.m.slice(0,3).map(function(x){return esc(x[0])+' '+esc(x[1])}).join(' · ')+'</div>':'')
  +'<div class="row" style="margin-top:14px"><a class="btn o sm" href="#urun-'+p.id+'" style="text-decoration:none;display:inline-flex;align-items:center">Ürünü incele</a><button class="btn sm" data-sat="'+SL.indexOf(p.s)+'">Satıcı sayfasına git</button></div></article>'}).join('')}
 return h}
function viewSepet(){var ids=Object.keys(st.cart);
 if(!ids.length)return '<h1>Sepet</h1><div class="empty">Sepetiniz boş. <a href="#pazar" style="color:var(--acc)">Çözüm pazarına göz atın</a>.</div>';
 var tot=0;return '<h1>Sepet</h1><div class="card">'+ids.map(function(i){var p=byId(i),q=st.cart[i];tot+=p.pr*q;return '<div class="ci">'+tile(p,'sm-t')+'<div class="sp"><b>'+esc(p.t)+'</b><div class="mut">'+esc(p.s)+'</div></div><div class="qty"><button data-q="'+i+'" data-d="-1" aria-label="Azalt">−</button>'+q+'<button data-q="'+i+'" data-d="1" aria-label="Artır">+</button></div><b style="min-width:110px;text-align:right">'+tl(p.pr*q)+'</b></div>'}).join('')+'<div class="row" style="justify-content:flex-end;margin-top:18px"><span class="mut">Toplam (+ KDV)</span><span class="price" style="font-size:24px">'+tl(tot)+'</span><button class="pbtn f" id="pay" style="width:auto;padding:0 24px;margin:0">Siparişi tamamla</button></div></div>'}

function viewHakkinda(){
 var s=function(t,b){return '<div class="card"><h2>'+t+'</h2>'+b+'</div>'};
 return '<div class="hero one"><div class="eyebrow">Hakkında</div><h1>Sürdürülebilirliği açık kaynak yapmak</h1><p>Fabrikalar enerji, atık ve karbon konusunda çoğu zaman aynı sorunları ayrı ayrı çözüyor. Masa Sıfır, çalışan çözümleri ölçülmüş sonuçlarıyla herkesin görebileceği hale getirir.</p></div><div class="hk">'
 +s('Dört ilke','<ol><li><b>Açık bilgi.</b> Onaylı vakalar, ölçüm yöntemi ve sonuçlarıyla herkese açık.</li><li><b>Onaylı veri.</b> Çözüm sağlayıcı paylaşır, müşteri fabrikanın sürdürülebilirlik uzmanı doğrular.</li><li><b>Katmanlı gizlilik.</b> Atık ve girdi ilanlarında kimlik, iki taraf kabul edene kadar gizli kalır.</li><li><b>Tarafsız pazar.</b> Çözümler fabrikanın önceliklerine göre sıralanır.</li></ol>')
 +s('Çözüm sağlayıcılar ve ortaklar için','<ul><li>Ürün bilgisi ve fiyat, üreticinin ya da yetkili çözüm ortağının kendisinden gelir.</li><li>Teklif talepleri ilgili satıcıya ya da yetkili ortağa yönlenir.</li><li>Vaka paylaşımı müşteri onayı olmadan yayınlanmaz; bağımsız doğrulama için ayrı bir seviye planlanır.</li></ul>')
 
 +'</div>'}
var KEY='od-demo-v3';
function save(){try{localStorage.setItem(KEY,JSON.stringify({F:F,cart:st.cart,Q:Q,PR:PR}))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.F&&d.F.length>=F.length){F=d.F;st.cart=d.cart||{};if(d.Q)Q=d.Q;if(d.PR)PR=d.PR}}catch(e){}}
function resetDemo(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
function render(){
 var h=location.hash.replace('#','')||'akis',v=h.indexOf('urun-')===0?'urun':h.indexOf('satici-')===0?'satici':h;
 $('#nav').innerHTML=[['akis','Vakalar'],['teklifler','Gelen teklifler'+(newQ()?' ('+newQ()+')':'')],['profil','Firma profili'],['pazar','Çözüm pazarı'],['danisman','Çözüm danışmanı <span class="tag" style="background:#fdeccb;color:#8a5a00">Premium</span>'],['hakkinda','Hakkında'],['onay','Onay'+(st.role==='uz'&&pend().length?' ('+pend().length+')':'')]].filter(function(x){return st.role==='sag'?(x[0]!=='pazar'&&x[0]!=='onay'&&x[0]!=='danisman'):(x[0]!=='teklifler'&&x[0]!=='profil')}).map(function(x){return '<a href="#'+x[0]+'" class="'+(x[0]===v||(x[0]==='pazar'&&(v==='urun'||v==='satici'))?'on':'')+'">'+x[1]+'</a>'}).join('');
 document.querySelectorAll('.role button').forEach(function(b){b.classList.toggle('on',b.dataset.role===st.role)});
 $('#app').innerHTML=v==='pazar'?viewPazar():v==='urun'?viewUrun(h.slice(5)):v==='danisman'?viewDanisman():v==='profil'?viewProfil():v==='teklifler'?viewTeklifler():v==='satici'?viewSatici(h.slice(7)):v==='onay'?viewOnay():v==='hakkinda'?viewHakkinda():viewAkis();
 if(v==='pazar'){$('#so').value=st.sort;if(st.fq){var q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);st.fq=0}}
 if(st.ff){var fq=$('#fq');if(fq){fq.focus();fq.setSelectionRange(fq.value.length,fq.value.length)}st.ff=0}if(v!==st.lv)window.scrollTo(0,0);st.lv=v;save()}

document.addEventListener('click',function(e){var b=e.target.closest('button'),d=b?b.dataset:{};
 if(!b){var c=e.target.closest('[data-go]');if(c)location.hash='urun-'+c.dataset.go;return}
 if(d.role){st.role=d.role;st.form=0;var nh=d.role==='sag'?'teklifler':'akis';if(location.hash.replace('#','')!==nh){location.hash=nh}else render()}
 else if(d.form!==undefined){st.form=+d.form;render()}
 else if(d.add){st.cart[d.add]=(st.cart[d.add]||0)+1;toast('Sepete eklendi.');if(d.now)location.hash='sepet';else render()}
 else if(b.id==='adgo'){var ad=st.ad;ad.prob=$('#ad1').value.trim();ad.sek=$('#ad2').value;ad.but=$('#ad3').value;if(!ad.prob){toast('Önce sorununuzu yazın.');return}adRun()}
 else if(d.pe){st.pe=1;render()}
 else if(b.id==='psv'){PR.slogan=$('#pe1').value.trim()||PR.slogan;PR.hak=$('#pe2').value.trim()||PR.hak;st.pe=0;toast('Profil kaydedildi.');render()}
 else if(d.qopen){st.qopen=st.qopen||{};st.qopen[d.qopen]=!st.qopen[d.qopen];render()}
 else if(d.qsend){var qq=Q.filter(function(x){return x.id==d.qsend})[0],ta=$('#qa'+d.qsend).value.trim();if(!ta){toast('Teklif tutarını yazın.');return}qq.st='gonderildi';qq.tut=ta+' + KDV';qq.sure=$('#qb'+d.qsend).value.trim()||'—';toast('Teklif gönderildi.');render()}
 else if(d.qno){Q.filter(function(x){return x.id==d.qno})[0].st='red';render()}
 else if(d.sat){location.hash='satici-'+d.sat}
 else if(b.id==='req'){var si=+location.hash.replace('#satici-','');if(SL[si]===SELF){Q.unshift({id:Date.now(),fab:MYF,who:EXP.n+' · '+EXP.r,prod:P.filter(function(p){return p.s===SELF})[0].id,msg:$('#rm').value.trim()||'Teklif talebi.',det:[['Lokasyon','Kütahya OSB']],ago:'şimdi',st:'yeni'})}toast('Talebiniz satıcıya iletildi.')}
 else if(d.rfq){toast('Teklif talebiniz satıcıya iletildi.')}
 else if(d.ask){toast('İstek gönderildi. Karşı taraf da kabul ederse kimlik bilgileri açılır.')}
 else if(d.like){st.liked[d.like]=!st.liked[d.like];render()}
 else if(d.cm){st.open[d.cm]=!st.open[d.cm];render()}
 else if(d.send){var i=$('#ci'+d.send),t=i.value.trim();if(!t)return;fById(d.send).cm.push([st.role==='uz'?EXP.n:SELF,t]);render()}
 else if(d.ok){if(!$('#chk'+d.ok).checked){toast('Önce veri doğrulama kutusunu işaretleyin.');return}var f=fById(d.ok);f.st='ok';f.ap=EXP.n+', '+EXP.r+' · '+MYF;toast('Onaylandı ve yayınlandı.');render()}
 else if(d.no){fById(d.no).st='red';toast('Paylaşım reddedildi, sağlayıcıya bildirildi.');render()}
 else if(d.scope){st.scope=d.scope;render()}
 else if(d.type){st.type=d.type;render()}
 else if(d.pr){var k=st.pr.indexOf(d.pr);k>-1?st.pr.splice(k,1):st.pr.push(d.pr);render()}
 else if(d.cat){st.cat=d.cat;render()}
 else if(d.q){var n=(st.cart[d.q]||0)+(+d.d);if(n<1)delete st.cart[d.q];else st.cart[d.q]=n;render()}
 else if(b.id==='rst'){resetDemo()}
 else if(b.id==='pay'){st.cart={};toast('Siparişiniz alındı.');render()}
 else if(b.id==='subm'){var tx=$('#ft').value.trim(),mv=$('#fm').value.trim();if(!tx||!mv){toast('Açıklama ve ölçüm yöntemi zorunlu.');return}
  var m=[];[1,2].forEach(function(n){var a=$('#fl'+n).value.trim(),v=$('#fv'+n).value.trim();if(a&&v)m.push([a,v])});var cu=$('#fc').value;
  F.unshift({id:Date.now(),type:'cozum',by:SELF,cust:cu,st:'bekliyor',scope:'osb',ago:'şimdi',text:tx,m:m,ver:mv,prod:$('#fp').value?+$('#fp').value:0,likes:0,cm:[]});st.form=0;toast('Onaya gönderildi: '+cu+' sürdürülebilirlik uzmanı doğrulayınca yayınlanır.');render()}
 else if(b.id==='subl'){var x=$('#fx').value.trim();if(!x){toast('Malzeme bilgilerini yazın.');return}var ty=$('#fk').value;
  F.unshift({id:Date.now(),type:ty,by:'Siz (kimlik gizli)',st:'ok',scope:$('#fs').value,ago:'şimdi',text:(ty==='atik'?'Atık ilanı: ':'Girdi talebi: ')+x,m:[],likes:0,cm:[]});st.form=0;toast('İlanınız yayınlandı.');render()}});
document.addEventListener('input',function(e){if(e.target.id==='fq'){st.fsq=e.target.value;st.ff=1;render()}if(e.target.id==='q'){st.q=e.target.value;st.fq=1;render()}});
document.addEventListener('change',function(e){if(e.target.id==='so'){st.sort=e.target.value;render()}});
load();window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
